[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skypulse"
version = "1.0.0"
description = "🌤️ SkyPulse - Lightweight Terminal Weather Intelligence Assistant CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "SkyPulse Team", email = "skypulse@example.com"}
]
keywords = [
    "weather",
    "cli",
    "terminal",
    "forecast",
    "tui",
    "weather-api",
    "ascii-art",
    "zero-dependencies",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
]

[project.scripts]
skypulse = "skypulse:main"

[project.urls]
Homepage = "https://github.com/gitstq/SkyPulse"
Documentation = "https://github.com/gitstq/SkyPulse#readme"
Repository = "https://github.com/gitstq/SkyPulse"
Issues = "https://github.com/gitstq/SkyPulse/issues"

[tool.setuptools]
py-modules = ["skypulse"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
